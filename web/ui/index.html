<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/muni-lab-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="MUNI lab" />
    <meta name="theme-color" content="#1f1f1d" />
    <meta
      name="description"
      content="대화로 문헌을 탐색하고 근거와 검증 과정을 기록하는 AI 연구 작업공간"
    />
    <title>MUNI lab</title>
  </head>
  <body>
    <div id="root" data-muchanipo-boot="static-fallback" data-muchanipo-boot-message="">
      <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;color:#f5f2ea;background:#0d0e0e;min-height:100vh;box-sizing:border-box">
        <strong>MUNI lab을 불러오는 중입니다…</strong>
        <p style="color:#80786d">If this stays visible, the frontend bundle did not start.</p>
      </div>
    </div>
    <script>
      document.documentElement.dataset.muchanipoBoot = 'html-shell';
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        document.documentElement.dataset.muchanipoBoot = 'window-error';
        document.documentElement.dataset.muchanipoBootMessage = String(event.message || event.error || event.filename || 'unknown error');
        if (!root) return;
        root.dataset.muchanipoBoot = 'window-error';
        root.dataset.muchanipoBootMessage = document.documentElement.dataset.muchanipoBootMessage;
        root.innerHTML = '<pre style="white-space:pre-wrap;margin:0;padding:24px;color:#fecaca;background:#0d0e0e;min-height:100vh;box-sizing:border-box;font:13px ui-monospace,SFMono-Regular,Menlo,monospace">MUNI lab frontend boot error:\n' + root.dataset.muchanipoBootMessage + '</pre>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        document.documentElement.dataset.muchanipoBoot = 'window-rejection';
        document.documentElement.dataset.muchanipoBootMessage = String(event.reason && (event.reason.stack || event.reason.message) || event.reason || 'unknown rejection');
        if (!root) return;
        root.dataset.muchanipoBoot = 'window-rejection';
        root.dataset.muchanipoBootMessage = document.documentElement.dataset.muchanipoBootMessage;
        root.innerHTML = '<pre style="white-space:pre-wrap;margin:0;padding:24px;color:#fecaca;background:#0d0e0e;min-height:100vh;box-sizing:border-box;font:13px ui-monospace,SFMono-Regular,Menlo,monospace">MUNI lab frontend boot rejection:\n' + root.dataset.muchanipoBootMessage + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
