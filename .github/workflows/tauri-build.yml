name: Tauri Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/muchanipo-tauri/**'
      - 'app/Muchanipo/**'
      - 'tools/build_scientific_sidecar.py'
      - 'pyproject.toml'
      - 'config/protocol/**'
      - 'muchanipo/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/build_protocol_fixtures.py'
      - 'uv.lock'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    paths:
      - 'app/muchanipo-tauri/**'
      - 'app/Muchanipo/**'
      - 'tools/build_scientific_sidecar.py'
      - 'pyproject.toml'
      - 'config/protocol/**'
      - 'muchanipo/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/build_protocol_fixtures.py'
      - 'uv.lock'
      - '.github/workflows/tauri-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/muchanipo-tauri
    env:
      MUCHANIPO_SIDECAR_PYTHON: ${{ github.workspace }}/.venv-sidecar/bin/python
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1704067200'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/muchanipo-tauri/package-lock.json

      - name: Setup Python sidecar toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned sidecar builder
        working-directory: .
        run: |
          python -m venv .venv-sidecar
          .venv-sidecar/bin/python -m pip install --upgrade pip
          .venv-sidecar/bin/python -m pip install 'pyinstaller==6.11.1' 'pytest>=8,<9' 'unicodedata2==15.1.0' 'httpx>=0.28'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify Tauri workspace paths
        run: |
          test -f Cargo.lock
          target_dir="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          expected="$GITHUB_WORKSPACE/app/muchanipo-tauri/target"
          if [ "$target_dir" != "$expected" ]; then
            echo "Unexpected cargo target directory: $target_dir (expected $expected)" >&2
            exit 1
          fi

      - name: Cache cargo registry and workspace target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/muchanipo-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/muchanipo-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: AI-scientist backend contracts
        working-directory: .
        run: |
          .venv-sidecar/bin/python -m pytest -q \
            tests/test_protocol_fixtures.py \
            tests/test_muchanipo_server.py \
            tests/test_cycle_repository.py \
            tests/test_scientific_contracts.py \
            tests/test_external_result_ingest.py \
            tests/test_scientific_validation.py \
            tests/test_scientific_cycle.py \
            tests/test_cycle_lifecycle_table.py \
            tests/test_scientific_handoff.py \
            tests/test_hypothesis_lifecycle.py \
            tests/test_report_attestation.py \
            tests/test_sidecar_entrypoint.py

      - name: Generated protocol corpus is current
        working-directory: .
        run: python tools/build_protocol_fixtures.py --check

      - name: Exact frontend fixtures
        run: npm run test:fixtures

      - name: Vitest
        run: npm test

      - name: Workspace Cargo tests
        working-directory: app/muchanipo-tauri/src-tauri
        run: cargo test --workspace --locked

      - name: Swift tests
        working-directory: app/Muchanipo
        run: swift test

      - name: Build sidecar twice from clean output
        run: |
          first_build_dir="$(mktemp -d)"
          npm run sidecar:build
          mv src-tauri/binaries "$first_build_dir/binaries"
          npm run sidecar:build
          diff -qr "$first_build_dir/binaries" src-tauri/binaries

      - name: Verify sidecar manifest and artifact
        run: npm run test:sidecar

      - name: Packaged sidecar lifecycle E2E
        run: npm run test:e2e:sidecar

      - name: Build and package Tauri
        run: npm run tauri:bundle

      - name: Inspect packaged sidecar
        run: |
          app_bundle=$(printf '%s\n' target/release/bundle/macos/*.app)
          test -d "$app_bundle"
          test -x "$app_bundle/Contents/MacOS/muchanipo-service"
          test -f "$app_bundle/Contents/Resources/binaries/muchanipo-service-aarch64-apple-darwin.manifest.json"

      - name: Upload macOS .app and .dmg artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: muchanipo-macos-${{ github.sha }}
          path: |
            app/muchanipo-tauri/target/release/bundle/macos/*.app
            app/muchanipo-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/muchanipo-tauri/target/release/bundle/macos/*.app
            app/muchanipo-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
  linux-sidecar-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/muchanipo-tauri
    env:
      MUCHANIPO_SIDECAR_PYTHON: ${{ github.workspace }}/.venv-sidecar/bin/python
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1704067200'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python sidecar toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned sidecar builder
        working-directory: .
        run: |
          python -m venv .venv-sidecar
          .venv-sidecar/bin/python -m pip install --upgrade pip
          .venv-sidecar/bin/python -m pip install 'pyinstaller==6.11.1' 'unicodedata2==15.1.0' 'httpx>=0.28'

      - name: Build native Linux sidecar
        run: npm run sidecar:build

      - name: Verify sidecar manifest and artifact
        run: npm run test:sidecar

      - name: Packaged sidecar lifecycle E2E
        run: npm run test:e2e:sidecar
